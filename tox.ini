[tox]
envlist =
    lint
    tests
    docs

[testenv]
package = wheel

[testenv:lint]
description = Run linters and type checks
package = skip
deps =
    ruff
commands =
    ruff format --diff src tests
    ruff check src tests

[testenv:format]
description = Abuse tox to do actual formatting on all files.
package = skip
deps =
    ruff
commands =
    ruff format src tests
    ruff check --fix-only src tests

[testenv:tests]
description = Run unit tests
deps =
    pytest
commands =
    pytest {posargs}

[testenv:docs]
description = Build the documentation with sphinx
deps =
    sphinx
    furo
commands =
    sphinx-build \
        {posargs:-E} \
        --builder html \
        --doctree-dir docs/build/doctree \
        --fail-on-warning \
        docs/src docs/build/html
