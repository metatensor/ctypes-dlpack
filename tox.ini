[tox]
envlist =
    lint
    tests

[testenv]
package = wheel

[testenv:lint]
description = Run linters and type checks
package = skip
deps =
    ruff
commands =
    ruff format --diff src tests
    ruff check src tests

[testenv:format]
description = Abuse tox to do actual formatting on all files.
package = skip
deps =
    ruff
commands =
    ruff format src tests
    ruff check --fix-only src tests

[testenv:tests]
description = Run unit tests
deps =
    pytest
commands =
    pytest {posargs}
