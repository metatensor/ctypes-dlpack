name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # Check all PR

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
            torch-pin: "==2.3.*"
            numpy-pin: "==2.0.*"
            jax-pin: "==0.5.*"
          - os: ubuntu-24.04
            python-version: "3.14"
          - os: macos-15
            python-version: "3.14"
          - os: windows-2022
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: python -m pip install tox

      - name: Run tests
        run: tox -e tests
        env:
          CTYPES_DLPACK_TORCH_PIN: ${{ matrix.torch-pin }}
          CTYPES_DLPACK_NUMPY_PIN: ${{ matrix.numpy-pin }}
          CTYPES_DLPACK_JAX_PIN: ${{ matrix.jax-pin }}
